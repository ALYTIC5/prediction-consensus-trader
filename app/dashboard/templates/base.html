<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}polybot console{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', path='console.css') }}">

  <!-- Pinned to current stable releases, verified against the CDN at
       implementation time (not guessed) - see docs/PHASE8_DESIGN.md. -->
  <script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="header__app">POLYBOT <span class="text-dim">/ console</span></div>
      <div class="header__meta">
        <span>{{ environment | default("development") }}</span>
        <div
          id="emergency-stop-header"
          class="emergency-stop-control"
          hx-get="/fragments/emergency-stop?variant=compact"
          hx-trigger="load, every 15s"
          hx-swap="innerHTML"
        ></div>
        <span id="header-heartbeat" title="checking...">
          <span class="status-dot"></span>
        </span>
      </div>
    </header>

    <nav class="nav">
      <a class="nav__link {% if active_page == 'overview' %}nav__link--active{% endif %}" href="/">Overview</a>
      <a class="nav__link {% if active_page == 'signals' %}nav__link--active{% endif %}" href="/signals">Signals</a>
      <a class="nav__link {% if active_page == 'traders' %}nav__link--active{% endif %}" href="/traders">Traders</a>
      <a class="nav__link {% if active_page == 'markets' %}nav__link--active{% endif %}" href="/markets">Markets</a>
      <div class="nav__section">Paper Trading</div>
      <a class="nav__link nav__link--sub {% if active_page in ('paper_overview', 'paper_detail') %}nav__link--active{% endif %}" href="/paper">Overview</a>
      <a class="nav__link nav__link--sub {% if active_page == 'paper_comparison' %}nav__link--active{% endif %}" href="/paper/comparison">Comparison</a>
      <a class="nav__link {% if active_page == 'events' %}nav__link--active{% endif %}" href="/events">Events</a>
      <a class="nav__link {% if active_page == 'risk' %}nav__link--active{% endif %}" href="/risk">Risk</a>
      <a class="nav__link {% if active_page == 'coherence' %}nav__link--active{% endif %}" href="/coherence">Coherence</a>
      <a class="nav__link {% if active_page == 'consensus_v2' %}nav__link--active{% endif %}" href="/consensus-v2">Consensus V2</a>
      <a class="nav__link {% if active_page == 'optimization' %}nav__link--active{% endif %}" href="/optimization">Optimization</a>
      <a class="nav__link {% if active_page == 'scout' %}nav__link--active{% endif %}" href="/scout">Scout</a>
      <a class="nav__link {% if active_page == 'discovery' %}nav__link--active{% endif %}" href="/discovery">Discovery</a>
      <a class="nav__link {% if active_page == 'tuning' %}nav__link--active{% endif %}" href="/tuning">Tuning</a>
      <a class="nav__link {% if active_page == 'logs' %}nav__link--active{% endif %}" href="/logs">Logs</a>
      <a class="nav__link {% if active_page == 'health' %}nav__link--active{% endif %}" href="/health">Job Health</a>
      <a class="nav__link {% if active_page == 'system_health' %}nav__link--active{% endif %}" href="/system-health">System Health</a>
    </nav>

    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    // Delegated so it keeps working after any htmx swap replaces rows -
    // .clickable-row exists on several tables (e.g. the paper overview
    // leaderboard) with cursor:pointer styling that implies the whole row
    // is clickable, not just the <a> text inside it.
    document.addEventListener("click", function (evt) {
      var row = evt.target.closest(".clickable-row");
      if (!row || evt.target.closest("a") || evt.target.closest(".info-tip")) return;
      var href = row.getAttribute("data-href");
      if (href) window.location.href = href;
    });
  </script>

  <script>
    // /healthz is JSON, not an HTML fragment, so this is a small plain
    // fetch poller rather than an htmx swap - htmx handles every other
    // auto-refreshing piece of this console, just not this one.
    (function () {
      var el = document.getElementById("header-heartbeat");
      var dot = el.querySelector(".status-dot");

      function classify(payload) {
        if (payload.db && payload.redis) return "fresh";
        if (payload.db || payload.redis) return "stale";
        return "dead";
      }

      function poll() {
        fetch("/healthz")
          .then(function (response) { return response.json(); })
          .then(function (payload) {
            var state = classify(payload);
            dot.className = "status-dot status-dot--" + state;
            el.title = "db=" + payload.db + " redis=" + payload.redis + " at " + payload.time;
          })
          .catch(function () {
            dot.className = "status-dot status-dot--dead";
            el.title = "healthz unreachable";
          });
      }

      poll();
      setInterval(poll, 10000);
    })();
  </script>

  <script>
    // Shared by any htmx-polled feed that wants the 300ms phosphor
    // left-border flash on rows that just arrived (not on rows already
    // present). Two calls: markSeenRows once against the page's initial
    // server-rendered content (so nothing flashes on first load), then
    // flashNewRows after every subsequent htmx swap.
    function markSeenRows(container, rowSelector) {
      var seen = new Set();
      container.querySelectorAll(rowSelector).forEach(function (row) {
        seen.add(row.getAttribute("data-row-id"));
      });
      container._seenRowIds = seen;
    }

    function flashNewRows(container, rowSelector) {
      var seen = container._seenRowIds || (container._seenRowIds = new Set());
      var freshRows = [];
      container.querySelectorAll(rowSelector).forEach(function (row) {
        var id = row.getAttribute("data-row-id");
        if (!seen.has(id)) {
          freshRows.push(row);
          seen.add(id);
        }
      });
      if (freshRows.length === 0) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      freshRows.forEach(function (row) { row.classList.add("flash"); });
      // Remove on the next frame so the browser registers the "on" state
      // first, then transitions it back off over the CSS 300ms duration.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          freshRows.forEach(function (row) { row.classList.remove("flash"); });
        });
      });
    }
  </script>

  <script>
    // The emergency-stop control's two-click confirm (see
    // _emergency_stop_control.html): first click arms the button and
    // relabels it from data-confirm-label; a second click within 4s
    // actually submits the form. Anywhere the button re-renders (header
    // poll, htmx swap after either POST) starts back at the unarmed state,
    // so a stale "confirm" label never survives past its own click.
    function armEmergencyStop(btn) {
      if (btn.dataset.armed === "true") {
        btn.closest("form").requestSubmit();
        return;
      }
      var originalLabel = btn.textContent;
      btn.dataset.armed = "true";
      btn.dataset.originalLabel = originalLabel;
      btn.textContent = btn.dataset.confirmLabel || "Confirm";
      btn.classList.add("emergency-stop__arm-btn--confirm");
      setTimeout(function () {
        if (btn.isConnected && btn.dataset.armed === "true") {
          btn.dataset.armed = "false";
          btn.textContent = btn.dataset.originalLabel;
          btn.classList.remove("emergency-stop__arm-btn--confirm");
        }
      }, 4000);
    }
  </script>

  <script>
    // Shared Chart.js renderers - any page can drop a
    // <canvas data-chart-json="..."> and call renderTrendChart/
    // renderBarChart(canvasId) from its own page-level scripts block
    // instead of redefining this config per page (originally written once
    // for the Optimization page, now shared across every page with a chart).
    function renderTrendChart(canvasId) {
      var canvas = document.getElementById(canvasId);
      if (!canvas) return;
      var raw = canvas.getAttribute('data-chart-json');
      if (!raw) return;
      try {
        var data = JSON.parse(raw);
        if (!data.labels || data.labels.length === 0) return;
        new Chart(canvas, {
          type: 'line',
          data: data,
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 300 },
            plugins: {
              legend: { display: false },
              tooltip: {
                enabled: true,
                backgroundColor: '#10141d',
                titleFont: { family: 'IBM Plex Mono', size: 11 },
                bodyFont: { family: 'IBM Plex Mono', size: 12 },
                titleColor: '#8a93a6',
                bodyColor: '#e6edf3',
                borderColor: '#1c2230',
                borderWidth: 1,
                padding: 8
              }
            },
            scales: {
              x: {
                grid: { color: '#1C2230' },
                ticks: { font: { family: 'IBM Plex Mono', size: 10 }, color: '#8a93a6', maxTicksLimit: 8 }
              },
              y: {
                grid: { color: '#1C2230' },
                ticks: { font: { family: 'IBM Plex Mono', size: 10 }, color: '#8a93a6' }
              }
            }
          }
        });
      } catch(e) {}
    }

    function renderBarChart(canvasId, options) {
      options = options || {};
      var canvas = document.getElementById(canvasId);
      if (!canvas) return;
      var raw = canvas.getAttribute('data-chart-json');
      if (!raw) return;
      try {
        var data = JSON.parse(raw);
        if (!data.labels || data.labels.length === 0) return;
        new Chart(canvas, {
          type: 'bar',
          data: data,
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 300 },
            indexAxis: options.horizontal ? 'y' : 'x',
            plugins: {
              legend: { display: !!options.legend, labels: { color: '#8a93a6', font: { family: 'IBM Plex Mono', size: 10 } } },
              tooltip: {
                enabled: true,
                backgroundColor: '#10141d',
                titleFont: { family: 'IBM Plex Mono', size: 11 },
                bodyFont: { family: 'IBM Plex Mono', size: 12 },
                titleColor: '#8a93a6',
                bodyColor: '#e6edf3',
                borderColor: '#1c2230',
                borderWidth: 1,
                padding: 8
              }
            },
            scales: {
              x: {
                stacked: !!options.stacked,
                grid: { color: '#1C2230' },
                ticks: { font: { family: 'IBM Plex Mono', size: 10 }, color: '#8a93a6' }
              },
              y: {
                stacked: !!options.stacked,
                grid: { color: '#1C2230' },
                ticks: { font: { family: 'IBM Plex Mono', size: 10 }, color: '#8a93a6' }
              }
            }
          }
        });
      } catch(e) {}
    }

    // A true sparkline (no axes, no gridlines, no legend) - renderTrendChart/
    // renderBarChart both draw full axis chrome that overwhelms a tiny
    // inline canvas. Used by the Scout page's copy-list rolling-forward-CLV
    // column.
    function renderSparkline(canvasId, color) {
      var canvas = document.getElementById(canvasId);
      if (!canvas) return;
      var raw = canvas.getAttribute('data-chart-json');
      if (!raw) return;
      try {
        var data = JSON.parse(raw);
        if (!data.labels || data.labels.length === 0) return;
        new Chart(canvas, {
          type: 'line',
          data: data,
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            elements: { point: { radius: 0 }, line: { borderWidth: 1.5, tension: 0 } },
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: {
              x: { display: false },
              y: { display: false }
            }
          }
        });
      } catch(e) {}
    }
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
